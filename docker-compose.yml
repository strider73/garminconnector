services:
  garmin-report:
    build: .
    volumes:
      - ./config.py:/app/config.py:ro
      - ./.claude:/app/.claude
      - garth-tokens:/root/.garth
    environment:
      - TZ=Australia/Sydney
      - DB_HOST=adventuretube.net
      - DB_PORT=5432
      - DB_NAME=family_member_schedule

volumes:
  garth-tokens:
