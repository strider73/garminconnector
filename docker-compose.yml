services:
  garmin-report:
    build: .
    volumes:
      - ./config.py:/app/config.py:ro
      - ./custom_scripts:/app/custom_scripts:ro
      - ./garminconnect:/app/garminconnect:ro
      - ./.claude:/app/.claude
      - garth-tokens:/root/.garth
    environment:
      - TZ=Australia/Sydney

volumes:
  garth-tokens:
